name: Build JAR, upload to DBFS and trigger Databricks run

on:
  push:
    branches: [ "pyspark-migration", "main" ]
    # Only build and run the Databricks job when the JAR source, its input data,
    # or this workflow changes. Edits elsewhere (e.g. experiments/ notebooks) skip CI.
    paths:
      - "SynopsisLake/**"
      - "spatial_join/**"
      - ".github/workflows/build-upload-and-run.yml"
  # Manual runs from the GitHub Actions tab are always allowed
  workflow_dispatch:

env:
  # Set your Databricks host (workspace URL) here if you prefer (or keep as is)
  DATABRICKS_HOST: https://dbc-702a0a68-ef83.cloud.databricks.com
  JAR_VOLUME_PATH: /Volumes/cs598_ccc_research_7474657373242960/synopsis_lake/jars/synopsislake.jar
  # UC volumes: jars = build artifacts, data = input datasets, output = job results
  DATA_VOLUME_DIR: /Volumes/cs598_ccc_research_7474657373242960/synopsis_lake/data
  OUTPUT_VOLUME_DIR: /Volumes/cs598_ccc_research_7474657373242960/synopsis_lake/output
  # Local repo folder whose CSVs are uploaded to DATA_VOLUME_DIR/spatial_join
  LOCAL_DATA_DIR: spatial_join
  # Dataset path read by the JAR (must be in a UC volume; /Workspace is not readable from java.io)
  DATASET_PATH: "/Volumes/cs598_ccc_research_7474657373242960/synopsis_lake/data/spatial_join/0.csv"
  # The job (cluster + one task per synopsis type) is defined in databricks.yml at the repo root.
  # These values are passed to the bundle as --var overrides (bundle defaults match).
  BUNDLE_TARGET: "ci"
  BUNDLE_JOB_KEY: "synopsis_overhead_exp"
  SYNOPSIS_FOLDER: "synout"
  SYNOPSIS_RESOLUTION: "128"
  # Small scale for now: first 5 files x 10000 records each (scale up later)
  NUM_FILE: "5"
  NUM_RECORDS: "10000"
  WRITE_DATA_FILE_INT: "0"

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build with Maven (skip tests)
        working-directory: ./SynopsisLake
        run: mvn -B -DskipTests package

      - name: Install Databricks CLI and jq
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Verify Databricks auth
        env:
          DATABRICKS_HOST: ${{ env.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "Host: $DATABRICKS_HOST"
          echo "Token length: ${#DATABRICKS_TOKEN}"
          echo "Token prefix: ${DATABRICKS_TOKEN:0:5}..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${DATABRICKS_TOKEN}" \
            "${DATABRICKS_HOST}/api/2.0/clusters/list")
          echo "Auth test HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Auth check returned HTTP $HTTP_CODE. Check token, host, and IP access lists."
            exit 1
          fi

      - name: Ensure UC schema and volumes exist
        env:
          DATABRICKS_HOST: ${{ env.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "Creating schema synopsis_lake if it does not exist..."
          SC_BODY=$(curl -s -w "\n%{http_code}" \
            -X POST "${DATABRICKS_HOST}/api/2.1/unity-catalog/schemas" \
            -H "Authorization: Bearer ${DATABRICKS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"catalog_name":"cs598_ccc_research_7474657373242960","name":"synopsis_lake"}')
          SC_CODE=$(echo "$SC_BODY" | tail -n1)
          SC_RESP=$(echo "$SC_BODY" | sed '$d')
          echo "Create schema HTTP $SC_CODE: $SC_RESP"
          if [ "$SC_CODE" != "200" ] && [ "$SC_CODE" != "409" ] && [ "$SC_CODE" != "400" ]; then
            echo "::error::Failed to create schema. HTTP $SC_CODE"
            exit 1
          fi
          # 400 with ALREADY_EXISTS is fine; fail on other 400 errors
          if [ "$SC_CODE" = "400" ] && ! echo "$SC_RESP" | grep -q "ALREADY_EXISTS"; then
            echo "::error::Schema creation failed with unexpected 400 error."
            exit 1
          fi

          for VOL in jars data output; do
            echo "Creating volume $VOL if it does not exist..."
            VL_BODY=$(curl -s -w "\n%{http_code}" \
              -X POST "${DATABRICKS_HOST}/api/2.1/unity-catalog/volumes" \
              -H "Authorization: Bearer ${DATABRICKS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"catalog_name\":\"cs598_ccc_research_7474657373242960\",\"schema_name\":\"synopsis_lake\",\"name\":\"${VOL}\",\"volume_type\":\"MANAGED\"}")
            VL_CODE=$(echo "$VL_BODY" | tail -n1)
            VL_RESP=$(echo "$VL_BODY" | sed '$d')
            echo "Create volume $VOL HTTP $VL_CODE: $VL_RESP"
            if [ "$VL_CODE" != "200" ] && [ "$VL_CODE" != "409" ] && [ "$VL_CODE" != "400" ]; then
              echo "::error::Failed to create volume $VOL. HTTP $VL_CODE"
              exit 1
            fi
            if [ "$VL_CODE" = "400" ] && ! echo "$VL_RESP" | grep -q "ALREADY_EXISTS"; then
              echo "::error::Volume $VOL creation failed with unexpected 400 error."
              exit 1
            fi
          done

      - name: Upload input datasets to data volume
        env:
          DATABRICKS_HOST: ${{ env.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATA_VOLUME_DIR: ${{ env.DATA_VOLUME_DIR }}
          LOCAL_DATA_DIR: ${{ env.LOCAL_DATA_DIR }}
        run: |
          if [ ! -d "$LOCAL_DATA_DIR" ]; then
            echo "::warning::Local data folder '$LOCAL_DATA_DIR' not found in repo; skipping dataset upload."
            exit 0
          fi
          for f in "$LOCAL_DATA_DIR"/*.csv; do
            [ -e "$f" ] || continue
            DEST="${DATA_VOLUME_DIR}/spatial_join/$(basename "$f")"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PUT "${DATABRICKS_HOST}/api/2.0/fs/files${DEST}?overwrite=true" \
              -H "Authorization: Bearer ${DATABRICKS_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f")
            echo "Upload $f -> $DEST: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "204" ]; then
              echo "::error::Dataset upload failed for $f with HTTP $HTTP_CODE"
              exit 1
            fi
          done

      - name: Upload JAR to UC Volume
        working-directory: ./SynopsisLake
        env:
          DATABRICKS_HOST: ${{ env.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          JAR=$(ls target/*SNAPSHOT.jar | head -n 1)
          echo "Found JAR: $JAR"
          # Upload via Files API (works reliably with UC Volumes)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PUT "${DATABRICKS_HOST}/api/2.0/fs/files/Volumes/cs598_ccc_research_7474657373242960/synopsis_lake/jars/synopsislake.jar" \
            -H "Authorization: Bearer ${DATABRICKS_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$JAR")
          echo "Upload HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "204" ]; then
            echo "::error::JAR upload failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Uploaded to ${{ env.JAR_VOLUME_PATH }}"

      - name: Validate and deploy bundle (applies databricks.yml job definition every run)
        env:
          DATABRICKS_HOST: ${{ env.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          VARS=(
            --var="jar_path=${JAR_VOLUME_PATH}"
            --var="dataset_path=${DATASET_PATH}"
            --var="output_uri=file://${OUTPUT_VOLUME_DIR}"
            --var="synopsis_folder=${SYNOPSIS_FOLDER}"
            --var="synopsis_resolution=${SYNOPSIS_RESOLUTION}"
            --var="num_file=${NUM_FILE}"
            --var="num_records=${NUM_RECORDS}"
            --var="write_data_file_int=${WRITE_DATA_FILE_INT}"
          )
          databricks bundle validate -t "$BUNDLE_TARGET" "${VARS[@]}"
          databricks bundle deploy -t "$BUNDLE_TARGET" "${VARS[@]}"

      - name: Run bundle job and fail CI on non-success
        # bundle run waits for the multi-task run to finish and exits non-zero if any task fails
        timeout-minutes: 60
        env:
          DATABRICKS_HOST: ${{ env.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle run -t "$BUNDLE_TARGET" "$BUNDLE_JOB_KEY"
